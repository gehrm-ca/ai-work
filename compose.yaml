# LOCAL DEMO ONLY.
# Ports bind to loopback so Docker does not expose the prototype API or UI on
# external interfaces by default. Production deployment requires the controls
# in docs/PRODUCTION_TRUST_BOUNDARIES.md.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PROGRAM_OS_ENABLE_LIVE_AGENT: "false"
      PROGRAM_OS_AUDIT_PATH: /var/program-os/audit.jsonl
      PROGRAM_OS_API_TOKEN: ${PROGRAM_OS_API_TOKEN:-}
      PROGRAM_OS_PROTECTED_RPM: ${PROGRAM_OS_PROTECTED_RPM:-30}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - program_os_audit:/var/program-os
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      PROGRAM_OS_API_URL: http://api:8000
      PROGRAM_OS_API_TOKEN: ${PROGRAM_OS_API_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"


volumes:
  program_os_audit:
