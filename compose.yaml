services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PROGRAM_OS_ENABLE_LIVE_AGENT: "false"
      PROGRAM_OS_AUDIT_PATH: /tmp/program-os/audit.jsonl
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      PROGRAM_OS_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
