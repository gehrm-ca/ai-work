name: V2 Hardened Evaluation

on:
  push:
    branches:
      - "test/api-key-smoke"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/eval-hardening

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Program OS
        run: python -m pip install -e ".[dev]"

      - name: Verify secret is injected
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing."
            exit 1
          fi

      - name: Run all 16 locked eval cases on hardened branch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Evaluating commit $(git rev-parse HEAD)"
          python -m program_os.evals.live \
            --model gpt-6.1-sol \
            --output artifacts/hardened-eval.json

      - name: Print release summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/hardened-eval.json").read_text())
          print(json.dumps({
              "model": report["model"],
              "cases": report["gold_case_count"],
              "baseline": {
                  "weighted_penalty": report["paths"]["baseline"]["weighted_penalty"],
                  "catastrophic": report["paths"]["baseline"]["catastrophic"],
                  "failure_dimensions": report["paths"]["baseline"]["failure_dimensions"],
                  "cases_without_failures": report["paths"]["baseline"]["cases_without_failures"],
              },
              "program_os": {
                  "weighted_penalty": report["paths"]["program_os"]["weighted_penalty"],
                  "catastrophic": report["paths"]["program_os"]["catastrophic"],
                  "failure_dimensions": report["paths"]["program_os"]["failure_dimensions"],
                  "cases_without_failures": report["paths"]["program_os"]["cases_without_failures"],
              },
          }, indent=2))
          PY

      - name: Enforce catastrophic release gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/hardened-eval.json").read_text())
          program_os = report["paths"]["program_os"]
          if program_os["catastrophic"]:
              raise SystemExit(
                  "Release gate failed: " + json.dumps(program_os["catastrophic_failures"])
              )
          print("Catastrophic release gate passed.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-hardened-eval
          path: artifacts/hardened-eval.json
          if-no-files-found: warn
