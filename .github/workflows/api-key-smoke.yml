name: V2 E01 RAG Scope Check

on:
  push:
    branches:
      - "test/api-key-smoke"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/eval-hardening

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Program OS
        run: python -m pip install -e ".[dev]"

      - name: Run E01
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Evaluating commit $(git rev-parse HEAD)"
          python -m program_os.evals.live \
            --model gpt-6.1-sol \
            --case E01 \
            --output artifacts/e01-eval.json

      - name: Print E01 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/e01-eval.json").read_text())
          print(json.dumps(report["paths"]["program_os"], indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-e01-eval
          path: artifacts/e01-eval.json
          if-no-files-found: warn
