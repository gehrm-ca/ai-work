name: Program OS CI

on:
  push:
    branches:
      - main
      - "v2/**"
      - "v2.1/**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Test
        run: python -m pytest -q
      - name: Validate demo launcher
        run: |
          bash -n scripts/run_demo.sh
          make -n demo
      - name: Validate static showcase export
        run: |
          rm -rf /tmp/program-os-showcase
          python -m program_os.showcase --output /tmp/program-os-showcase/atlas-demo.json
          python -m json.tool /tmp/program-os-showcase/atlas-demo.json >/dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build


  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build API container
        run: docker build -f Dockerfile.api -t program-os-api .
      - name: Build web container
        run: docker build -f web/Dockerfile -t program-os-web web
