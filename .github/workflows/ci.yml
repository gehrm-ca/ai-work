name: Program OS CI

on:
  push:
    branches:
      - main
      - "v2/**"
      - "v2.1/**"
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Validate demo launcher
        run: |
          bash -n scripts/run_demo.sh
          make -n demo

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build


  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build -f Dockerfile.api -t program-os-api .
      - name: Build web container
        run: docker build -f web/Dockerfile -t program-os-web web
