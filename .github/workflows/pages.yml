name: Publish deterministic Program OS demo

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "src/program_os/demo.py"
      - "src/program_os/showcase.py"
      - "examples/atlas/data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Program OS
        run: python -m pip install -e .

      - name: Build static showcase
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          python -m program_os.showcase --output _site/atlas-demo.json
          python -m json.tool _site/atlas-demo.json >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
