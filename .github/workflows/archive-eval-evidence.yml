name: Archive V2 benchmark evidence

# One-off: copies the raw report of the final V2 benchmark out of its Actions
# artifact (which expires) and commits it to this branch for review.
on:
  push:
    branches:
      - "evidence/v2-final-eval"
    paths:
      - ".github/workflows/archive-eval-evidence.yml"

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the final benchmark report
        uses: actions/download-artifact@v4
        with:
          name: v2-final-eval
          run-id: 43665330982
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/evidence

      - name: Commit the report
        run: |
          set -euo pipefail
          ls -la "$RUNNER_TEMP/evidence"
          mkdir -p docs/evals
          cp "$RUNNER_TEMP/evidence/final-v2-eval.json" docs/evals/v2-final-eval.json
          python3 -m json.tool docs/evals/v2-final-eval.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evals/v2-final-eval.json
          git commit -m "Archive the final V2 benchmark report (Actions run 43665330982, artifact v2-final-eval)"
          git push origin HEAD:evidence/v2-final-eval
