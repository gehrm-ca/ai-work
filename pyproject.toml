[project]
name = "program-os"
version = "0.2.0"
description = "Evidence-grounded portfolio control and decision intelligence for program managers"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.12,<3",
  "openai-agents==0.24.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
