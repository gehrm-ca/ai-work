[project]
name = "program-os"
version = "0.2.0"
description = "Evidence-grounded portfolio control and decision intelligence for program managers"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
  "pydantic==2.14.3",
  "httpx==0.28.1",
  "openai-agents==0.25.0",
  "fastapi==0.163.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
